<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signet Lift Notices</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      visibility: hidden;
    }
    .active {
      visibility: visible;
    }
  </style>
</head>
<body>

  <img id="imgA" class="slide active" src="BINTEX.jpeg" alt="Notice">
  <img id="imgB" class="slide" src="BOD26.jpeg" alt="Notice">

  <script>
    const slides = [
      'BINTEX.jpeg',
      'BOD26.jpeg',
      'Sgnet Lift Power failure Caution Poster.jpeg',
      'Signet BOD Notice on Sale of Flat.jpeg',
      'Signet Water Saving.jpeg'
    ];

    // Preload all slides into memory so Tizen decoder doesn't lag
    slides.forEach((src) => {
      const p = new Image();
      p.src = encodeURI(src);
    });

    let currentIdx = 0;
    let showingA = true;
    const imgA = document.getElementById('imgA');
    const imgB = document.getElementById('imgB');

    // Cycle slide every 10 seconds without dropping to blank
    setInterval(() => {
      currentIdx = (currentIdx + 1) % slides.length;
      const nextSrc = encodeURI(slides[currentIdx]);

      if (showingA) {
        imgB.src = nextSrc;
        imgB.classList.add('active');
        imgA.classList.remove('active');
      } else {
        imgA.src = nextSrc;
        imgA.classList.add('active');
        imgB.classList.remove('active');
      }
      showingA = !showingA;
    }, 10000);

    // Register Service Worker for offline persistent storage
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('Offline cache successfully active:', registration.scope);
          })
          .catch((error) => {
            console.error('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
