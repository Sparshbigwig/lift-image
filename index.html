<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signet Lift Notices</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    #slider {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

  <img id="slider" src="BINTEX.jpeg" alt="Notice">

  <script>
    const slides = [
      'BINTEX.jpeg',
      'BOD26.jpeg',
      'Sgnet Lift Power failure Caution Poster.jpeg',
      'Signet BOD Notice on Sale of Flat.jpeg',
      'Signet Water Saving.jpeg'
    ];
    let idx = 0;
    const img = document.getElementById('slider');

    // Cycle slide every 10 seconds
    setInterval(() => {
      idx = (idx + 1) % slides.length;
      img.src = encodeURI(slides[idx]);
    }, 10000);

    // Register Service Worker for offline persistent storage
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('Offline cache successfully active:', registration.scope);
          })
          .catch((error) => {
            console.error('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
